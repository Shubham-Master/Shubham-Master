<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="titleClip">
      <text x="450" y="118" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="58" text-anchor="middle" letter-spacing="3">SHUBHAM KUMAR</text>
    </clipPath>
  </defs>

  <text x="450" y="118" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="58" text-anchor="middle" fill="#22d3ee" filter="url(#softGlow)" opacity="0.5" letter-spacing="18">
    SHUBHAM KUMAR
    <animate attributeName="letter-spacing" values="18;3;3" dur="1.5s" keyTimes="0;0.65;1" fill="freeze"/>
    <animate attributeName="opacity" values="0;0.5;0.35;0.5" dur="4s" begin="1.5s" repeatCount="indefinite"/>
  </text>

  <text x="450" y="118" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="58" text-anchor="middle" fill="url(#titleGrad)" letter-spacing="18" opacity="0">
    SHUBHAM KUMAR
    <animate attributeName="letter-spacing" values="18;3;3" dur="1.5s" keyTimes="0;0.65;1" fill="freeze"/>
    <animate attributeName="opacity" values="0;0;1;1" dur="1.5s" keyTimes="0;0.12;0.6;1" fill="freeze"/>
  </text>

  <g clip-path="url(#titleClip)">
    <rect x="-260" y="40" width="220" height="130" fill="url(#sheen)">
      <animateTransform attributeName="transform" type="translate" values="-260 0; 1000 0" dur="1.6s" begin="1.5s" fill="freeze"/>
    </rect>
  </g>

  <text x="450" y="160" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="middle" fill="#8b949e" opacity="0" letter-spacing="0.5">
    Cloud Platform Engineer · AI Platform Ops
    <animate attributeName="opacity" values="0;0;1" dur="2.3s" keyTimes="0;0.72;1" fill="freeze"/>
    <animate attributeName="y" values="172;172;160" dur="2.3s" keyTimes="0;0.72;1" fill="freeze"/>
  </text>

  <rect x="450" y="180" width="0" height="3" rx="1.5" fill="url(#titleGrad)">
    <animate attributeName="x" values="450;270" dur="0.01s" begin="2.3s" fill="freeze"/>
    <animate attributeName="width" values="0;360" dur="0.6s" begin="2.3s" fill="freeze"/>
  </rect>
</svg>
